; PgBouncer para este projeto (um banco PostgreSQL por cliente). Exemplo para produção:
; ajuste endereços, tamanhos e senhas. Veja "Conexões com o banco" no README.
;
; No .env do app:
;   DB_HOST=127.0.0.1        DB_PORT=6432          (o PgBouncer)
;   DB_DIRECT_HOST=127.0.0.1 DB_DIRECT_PORT=5432   (o PostgreSQL, para migrations e criar/apagar bancos)
;   DB_SSLMODE=disable       (app e PgBouncer na mesma máquina ou rede privada)
;   DB_PERSISTENT=false  DB_TENANT_PERSISTENT=false
;   DB_EMULATE_PREPARES=true  só se o PgBouncer for anterior à 1.21

[databases]
; qualquer banco (a base pai e o banco de cada cliente, inclusive os criados depois).
; auth_dbname: a consulta de senhas roda SEMPRE no banco da base pai (troque pelo seu DB_DATABASE);
; sem isso o PgBouncer a procuraria dentro de cada banco de cliente, onde a função não existe.
* = host=127.0.0.1 port=5432 auth_dbname=obra_facil

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432

; autenticação: o PgBouncer pergunta ao PostgreSQL (auth_query), então não precisa listar
; cada usuário. Crie o usuário "pgbouncer" e a função no banco da base pai
; (deploy/pgbouncer/preparar-postgres.sql).
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer
auth_query = SELECT usename, passwd FROM pgbouncer.usuario($1)

; uma conexão real só fica emprestada durante a transação
pool_mode = transaction

; quantos clientes (processos do PHP) podem conectar no PgBouncer
max_client_conn = 1000
; conexões reais por par banco/usuário: o PgBouncer cria um pool por banco de cliente
default_pool_size = 10
; 0: sem conexões reservadas ao banco de cada cliente. Com valor maior o PgBouncer reabriria
; conexões logo depois de elas serem encerradas ao apagar um cliente, e o DROP DATABASE falharia.
min_pool_size = 0
reserve_pool_size = 3
reserve_pool_timeout = 3
; teto de conexões reais por banco; some os bancos ativos e confira com o max_connections
max_db_connections = 20

; devolve conexões ociosas ao PostgreSQL (clientes que ninguém usa há tempo não seguram conexão)
server_idle_timeout = 300
server_lifetime = 3600
query_wait_timeout = 30

; PgBouncer 1.21+: comandos preparados em modo transaction (o PDO do Laravel usa)
max_prepared_statements = 100

; o PDO do PostgreSQL manda este parâmetro ao conectar
ignore_startup_parameters = extra_float_digits

; Em modo transaction, SET de sessão (o que o Laravel faz ao conectar: search_path, client_encoding,
; fuso) não é confiável entre transações. Hoje não faz diferença porque o padrão é public e UTF8.

; administração (psql -p 6432 pgbouncer, depois SHOW POOLS; SHOW STATS;): usuário separado do
; "pgbouncer" da auth_query, com senha própria no userlist.txt
admin_users = pgbouncer_admin
stats_users = pgbouncer_admin
